<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}agentssh{% endblock %}</title>
<link rel="stylesheet" href="/assets/player.css">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #14161a; color: #d8dee9; font: 14px/1.5 ui-monospace, "JetBrains Mono", Menlo, monospace; }
  header { padding: 12px 24px; border-bottom: 1px solid #2a2f38; display: flex; gap: 18px; align-items: baseline; }
  header .brand { color: #8fbcbb; font-weight: 700; text-decoration: none; font-size: 16px; }
  header a { color: #81a1c1; text-decoration: none; }
  header a:hover { text-decoration: underline; }
  main { padding: 20px 24px; max-width: 1280px; margin: 0 auto; }
  h2 { font-size: 15px; color: #8fbcbb; margin: 24px 0 8px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 5px 12px 5px 0; border-bottom: 1px solid #23272f; white-space: nowrap; }
  th { color: #6b7383; font-weight: 500; }
  td.cmd { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 0; width: 100%; color: #a3be8c; }
  pre.cmd { margin: 0; padding: 8px 12px; background: #1b1e24; border: 1px solid #2a2f38; border-radius: 4px;
            color: #a3be8c; overflow-x: auto; white-space: pre; }
  pre.cmd.inline { padding: 0; background: none; border: 0; max-height: 4.5em; overflow-y: auto; }
  table.commands td { vertical-align: top; white-space: normal; }
  table.commands td:last-child { width: 100%; }
  .exit-ok { color: #6b7383; }
  .exit-bad { color: #bf616a; font-weight: 700; }
  .links a { color: #81a1c1; }
  a { color: #88c0d0; }
  .status-active { color: #a3be8c; }
  .status-detached { color: #ebcb8b; }
  .status-closed { color: #6b7383; }
  .muted { color: #6b7383; }
  dl { display: grid; grid-template-columns: 10em 1fr; gap: 2px 12px; margin: 0; }
  dt { color: #6b7383; }
  dd { margin: 0; word-break: break-all; }
  /* The player sizes its terminal to the container; let it use the full width
     of the page so a 120-column recording is not shrunk to unreadable type. */
  .player-wrap { margin-top: 16px; }
  .player-wrap .ap-player { max-width: 100%; }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">agentssh</a>
  <a href="/sessions">sessions</a>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
