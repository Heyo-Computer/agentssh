[package]
name = "agentssh"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.0"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
rand = "0.10.2"
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
russh = "0.63.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde", "macros", "local-offset"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
